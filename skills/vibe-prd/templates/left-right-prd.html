.sec-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; font-size: 15px; font-weight: 620; }
.sec-title small { font-size: 12px; font-weight: 400; color: var(--muted); }
.sec-title + .tbl-wrap { margin-bottom: 26px; }
.edge td:nth-child(4), .track td:nth-child(4) { white-space: nowrap; }
.edge .cat td { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.edge .cat small { margin-left: 6px; font-weight: 400; color: var(--muted); }

.cat-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; vertical-align: 1px; }
.cat-empty { background: #64748B; } .cat-boundary { background: #7C3AED; } .cat-network { background: #0284C7; }
.cat-concurrency { background: #D97706; } .cat-permission { background: #059669; } .cat-other { background: var(--line-strong); }

.track td:nth-child(3) { font-family: var(--mono); font-size: 11.5px; }

.refs .num { width: 18px; height: 18px; font-size: 10.5px; }

/* lightbox + toast */
.lightbox { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(15, 23, 42, .55); }
.lightbox[hidden] { display: none; }
.lb { display: flex; flex-direction: column; width: min(1200px, 100%); height: min(88vh, 940px); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-pop); }
.lb-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.lb-head h3 { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 600; }
.lb-zoom { min-width: 46px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lb-body { flex: 1; min-height: 0; overflow: auto; padding: 28px; background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 18px 18px; }
.lb-body svg { display: block; margin: 0 auto; max-width: none !important; height: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; max-width: min(520px, calc(100vw - 32px)); padding: 9px 14px; border-radius: 9px; background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: var(--shadow-pop); opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* narrow document pane */
@container doc (max-width: 720px) {
  .tab small { display: none; }
}
@container doc (max-width: 560px) {
  .card-body { margin-left: 0; }
  .panel { padding: 14px 14px 40px; }
}

/* phones & small tablets: one pane at a time */
@media (max-width: 900px) {
  .topbar { gap: 8px; padding: 0 8px 0 10px; }
  .brand { padding-right: 10px; }
  .wordmark, .chip-ver, .actions .btn span, .lights, .device-seg, #btn-open { display: none; }
  .actions .btn { width: 34px; padding: 0; justify-content: center; }
  .view-seg { display: inline-flex; }
  .split { display: block; position: relative; }
  .stage, .doc { position: absolute; inset: 0; }
  .splitter { display: none; }
  .app[data-view="proto"] .doc, .app[data-view="doc"] .stage { visibility: hidden; pointer-events: none; }
}
@media (max-width: 520px) {
  .chip-status, #btn-print, .issues { display: none; }
  .doc-title { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* print: A4 landscape, every panel expanded */
@page { size: A4 landscape; margin: 9mm 10mm; }
@media print {
  :root, [data-theme="dark"] {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F1F5F9; --line: #D5DDE7; --line-strong: #CBD5E1;
    --ink: #0F172A; --ink-2: #334155; --muted: #64748B; --grid-dot: #FFFFFF;
    --primary: #2563EB; --primary-soft: #EFF6FF; --primary-ring: rgba(37, 99, 235, .28);
    --mark: #E11D48; --warn: #B45309; --warn-bg: #FFFBEB; --warn-line: #FDE68A; --warn-ink: #78350F;
    color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

(function () {
  var plan = 'Starter', price = 8, discount = 0;
  var $ = function (id) { return document.getElementById(id); };
  function money(n) { return '$' + n.toFixed(2); }
  function render() {
    var seats = parseInt($('seats').value, 10) || 0;
    var unit = $('yearly').checked ? price * 10 / 12 : price;
    var sub = unit * seats, disc = sub * discount, total = sub - disc;
    $('sum-plan').textContent = plan + ' × ' + seats;
    $('sum-sub').textContent = money(sub);
    $('sum-disc').textContent = '−' + money(disc);
    $('sum-total').textContent = money(total);
    $('pay').textContent = 'Pay ' + money(total);
    $('pay').disabled = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('email').value);
  }
  document.querySelectorAll('.plan').forEach(function (el) {
    el.addEventListener('click', function () {
      document.querySelectorAll('.plan').forEach(function (p) { p.classList.remove('on'); });
      el.classList.add('on'); plan = el.querySelector('b').textContent; price = +el.dataset.price; render();
    });
  });
  ['seats', 'email', 'yearly'].forEach(function (id) { $(id).addEventListener('input', render); });
  $('apply').addEventListener('click', function () {
    var ok = $('coupon').value.trim().toUpperCase() === 'VIBE20';
    discount = ok ? 0.2 : 0;
    $('coupon-msg').className = 'msg ' + (ok ? 'ok' : 'err');
    $('coupon-msg').textContent = ok ? 'VIBE20 applied: 20% off.' : 'This code is not valid.';
    render();
  });
  $('pay').addEventListener('click', function () {
    $('pay').textContent = 'Processing…';
    setTimeout(function () { $('pay-msg').className = 'msg ok'; $('pay-msg').textContent = 'Payment received. Welcome aboard!'; render(); }, 900);
  });
  render();
})();
</script>

    panels.arch.innerHTML = printHead('arch') + (diagrams.length ? diagrams.map((d, i) => `
      <figure class="dg" id="diagram-${i}">
        <header class="dg-head"><span class="kind">${esc(T.kind[kindOf(d)] || T.kind.other)}</span><h3>${esc(d.title || '')}</h3>
          <button type="button" class="icon-btn" data-act="zoom" data-i="${i}" title="${T.zoom}" aria-label="${T.zoom}">${icon('expand')}</button>
          <button type="button" class="icon-btn" data-act="code" data-i="${i}" title="${T.source}" aria-label="${T.source}" aria-expanded="false">${icon('code')}</button></header>
        <div class="dg-canvas" data-i="${i}"><p class="dg-wait">${T.mmLoading}</p></div>
        <div class="dg-code" hidden><button type="button" class="btn copy" data-act="copy" data-i="${i}">${icon('copy')}${T.copy}</button><pre>${esc(String(d.code || '').trim())}</pre></div>
        ${d.note ? `<figcaption class="dg-note">${md(d.note)}</figcaption>` : ''}
      </figure>`).join('') : `<p class="empty">${T.empty}</p>`);
  }

  const refs = (r) => `<span class="refs">${[].concat(r || []).map((n) => `<button type="button" class="num" data-ref="${Number(n)}" title="${esc(T.locate)} ${Number(n)}">${Number(n)}</button>`).join('')}</span>`;
  function renderEdge() {
    const known = new Set(CATS);
    const groups = CATS.map((c) => [c, edgeCases.filter((e) => e.category === c)]);
    const other = edgeCases.filter((e) => !known.has(e.category));
    if (other.length) groups.push(['other', other]);
    let rows = '';
    groups.forEach(([c, items]) => {
      rows += `<tr class="cat"><td colspan="4"><span class="cat-dot cat-${c}"></span>${esc(T.cats[c])}${T.catsAlt[c] ? `<small>${esc(T.catsAlt[c])}</small>` : ''}<span class="count">${items.length}</span></td></tr>`;
      if (!items.length) rows += `<tr class="miss"><td colspan="4">${T.missCat}</td></tr>`;
      items.forEach((e) => { rows += `<tr><td>${md(e.trigger)}</td><td>${md(e.ui)}</td><td>${md(e.fallback)}</td><td>${refs(e.refs)}</td></tr>`; });
    });
    const track = tracking.map((t) => `<tr><td>${esc(t.event)}</td><td>${md(t.trigger)}</td><td>${esc(t.properties)}</td><td>${refs(t.refs)}</td></tr>`).join('');
    panels.edge.innerHTML = printHead('edge')
      + `<h3 class="sec-title">${T.edgeTitle[0]}${sub(T.edgeTitle)}</h3><div class="tbl-wrap"><table class="t edge"><thead><tr>${T.edgeCols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`
      + `<h3 class="sec-title">${T.trackTitle[0]}${sub(T.trackTitle)}</h3>` + (track ? `<div class="tbl-wrap"><table class="t track"><thead><tr>${T.trackCols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${track}</tbody></table></div>` : `<p class="empty">${T.empty}</p>`);
  }

  /* ---------- mermaid (CDN with fallbacks, rendered once per theme) ---------- */
  const MM_VARS = {
    light: { darkMode: false, background: '#FFFFFF', primaryColor: '#EFF6FF', primaryBorderColor: '#2563EB', primaryTextColor: '#0F172A', secondaryColor: '#F1F5F9', secondaryBorderColor: '#94A3B8', secondaryTextColor: '#0F172A', tertiaryColor: '#FFFFFF', tertiaryBorderColor: '#CBD5E1', tertiaryTextColor: '#0F172A', lineColor: '#64748B', textColor: '#334155', noteBkgColor: '#FFFBEB', noteBorderColor: '#F59E0B', noteTextColor: '#78350F', edgeLabelBackground: '#FFFFFF', attributeBackgroundColorOdd: '#FFFFFF', attributeBackgroundColorEven: '#F8FAFC' },
    dark: { darkMode: true, background: '#1E293B', primaryColor: '#1E3A8A', primaryBorderColor: '#60A5FA', primaryTextColor: '#F1F5F9', secondaryColor: '#334155', secondaryBorderColor: '#64748B', secondaryTextColor: '#F1F5F9', tertiaryColor: '#1E293B', tertiaryBorderColor: '#475569', tertiaryTextColor: '#F1F5F9', lineColor: '#94A3B8', textColor: '#E2E8F0', noteBkgColor: '#422006', noteBorderColor: '#F59E0B', noteTextColor: '#FDE68A', edgeLabelBackground: '#1E293B', attributeBackgroundColorOdd: '#1E293B', attributeBackgroundColorEven: '#0F172A' }
  };
  function mermaidSources() {
    const v = MERMAID_VERSION;
    const urls = [
      `https://cdn.jsdelivr.net/npm/mermaid@${v}/dist/mermaid.min.js`,
      `https://unpkg.com/mermaid@${v}/dist/mermaid.min.js`,
      `https://registry.npmmirror.com/mermaid/${v}/files/dist/mermaid.min.js`
    ];
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* no Intl */ }
    if (/^zh-(CN|Hans)/i.test(navigator.language || '') || /^Asia\/(Shanghai|Chongqing|Harbin|Urumqi)$/.test(tz)) urls.unshift(urls.pop());
    return urls;
  }
  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    const timer = setTimeout(() => { s.remove(); reject(new Error('timeout')); }, 6000);
    s.src = src; s.async = true;
    s.onload = () => { clearTimeout(timer); window.mermaid ? resolve() : reject(new Error('no global')); };
    s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error('network')); };
    document.head.appendChild(s);
  });
  async function loadMermaid() {
    if (window.mermaid) return true;
    for (const src of mermaidSources()) {
      try { await loadScript(src); return true; } catch (e) { /* try the next CDN */ }
    }
    return false;
  }
  async function renderDiagrams() {
    if (!diagrams.length) return;
    const hosts = $$('.dg-canvas');
    const ok = await loadMermaid();
    if (!ok) {
      hosts.forEach((h) => { h.innerHTML = `<p class="dg-offline">${T.mmOffline}</p>`; h.nextElementSibling.hidden = false; });
      console.warn('[vibe-prd] Mermaid could not be loaded; showing diagram source instead.');
      return;
    }
    const fontFamily = getComputedStyle(document.body).fontFamily;
    const failed = new Set();
    for (const theme of ['light', 'dark']) {
      window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base', fontFamily, themeVariables: Object.assign({ fontFamily, fontSize: '13px' }, MM_VARS[theme]), flowchart: { curve: 'basis' } });
      for (let i = 0; i < diagrams.length; i++) {
        if (failed.has(i)) continue;
        const id = `vprd-${theme}-${i}-${Date.now().toString(36)}`;
        try {
          const out = await window.mermaid.render(id, String(diagrams[i].code || '').trim());
          hosts[i].insertAdjacentHTML('beforeend', `<div class="svg-${theme}">${out.svg}</div>`);
        } catch (err) {
          failed.add(i);
          const msg = String((err && (err.message || err.str)) || err).split('\n').slice(0, 3).join(' ');
          hosts[i].insertAdjacentHTML('beforeend', `<div class="dg-error"><b>${T.mmError}</b>${esc(msg)}</div>`);
          hosts[i].nextElementSibling.hidden = false;
          console.warn(`[vibe-prd] Mermaid error in "${diagrams[i].title || i}": ${msg}`);
          ['d' + id, id].forEach((x) => { const n = document.getElementById(x); if (n) n.remove(); });
        }
      }
    }
    hosts.forEach((h) => { const w = h.querySelector('.dg-wait'); if (w) w.remove(); });
  }

  /* ---------- prototype frame ---------- */
  const prototypeHTML = () => { const tpl = $('#vibe-prd-prototype'); return tpl ? tpl.innerHTML.trim() : ''; };
  function buildFrame() {
    const runtime = `(${prdRuntime.toString()})(${JSON.stringify({ badges: state.badges, dwell: 420 })});`;
    frame.srcdoc = `<!DOCTYPE html>\n${prototypeHTML()}\n<script>${runtime}<\/script>\n<!-- vibe-prd ${Date.now()} -->`;
  }
  function openPrototype() {
    const url = URL.createObjectURL(new Blob([`<!DOCTYPE html>\n${prototypeHTML()}`], { type: 'text/html' }));
    window.open(url, '_blank', 'noopener');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function fitDevice() {
    const d = isNarrow() ? 'desktop' : state.device;
    device.dataset.device = d;
    if (d === 'desktop') { device.style.cssText = ''; return; }
    const pad = 20, w = DEVICE_W[d];
    const s = Math.min(1, (canvas.clientWidth - pad * 2) / w);
    const h = Math.min((canvas.clientHeight - pad * 2) / s, d === 'mobile' ? 812 : 1024);
    device.style.width = w + 'px';
    device.style.height = h + 'px';
    device.style.transform = `scale(${s})`;
    device.style.left = Math.max(pad, (canvas.clientWidth - w * s) / 2) + 'px';
    device.style.top = Math.max(pad, (canvas.clientHeight - h * s) / 2) + 'px';
  }

  /* ---------- state changes ---------- */
  function setCurrent(id) {
    state.current = id;
    $$('.card').forEach((c) => c.classList.toggle('is-current', Number(c.dataset.id) === id));
    $$('[data-jump]').forEach((b) => b.classList.toggle('is-current', Number(b.dataset.jump) === id));
  }
  function switchTab(name) {
    if (!panels[name] || name === state.tab) return;
    state.scroll[state.tab] = docBody.scrollTop;
    state.tab = name;
    $$('.tab').forEach((b) => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    Object.keys(panels).forEach((k) => { panels[k].hidden = k !== name; });
    docBody.scrollTop = state.scroll[name] || 0;
  }
  function revealCard(id, glow) {
    setCurrent(id);
    if (state.tab !== 'notes') switchTab('notes');
    const card = document.getElementById('annotation-card-' + id);
    if (!card) return;
    const pr = docBody.getBoundingClientRect(), cr = card.getBoundingClientRect();
    if (cr.top < pr.top || cr.bottom > pr.bottom) card.scrollIntoView({ behavior, block: cr.height > pr.height * 0.85 ? 'start' : 'center' });
    if (glow) { card.classList.remove('is-glow'); void card.offsetWidth; card.classList.add('is-glow'); }
  }
  function locate(id, opts = {}) {
    setCurrent(id);
    if (opts.pin) { state.pinned = id; post({ type: 'pin', id }); }
    if (opts.explicit && isNarrow()) setView('proto');
    post({ type: 'focus', id, flash: true });
  }
  function togglePin(id) {
    state.pinned = state.pinned === id ? null : id;
    post({ type: 'pin', id: state.pinned });
    if (state.pinned != null) locate(id);
  }
  function setBadges(on) {
    state.badges = on; store.set('badges', on ? '1' : '0');
    $('#btn-badges').setAttribute('aria-pressed', String(on));
    post({ type: 'badges', visible: on });
  }
  function setTheme(t) { root.dataset.theme = t; store.set('theme', t); }
  function setDevice(d) {
    state.device = DEVICE_W[d] ? d : 'desktop'; store.set('device', state.device);
    $$('#device-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.device === state.device)));
    fitDevice();
  }
  function setView(v) {
    app.dataset.view = v;
    $$('#view-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  }
  function setSplit(p, save) {
    state.split = Math.min(75, Math.max(30, p));
    split.style.setProperty('--left', state.split + '%');
    splitter.setAttribute('aria-valuenow', String(Math.round(state.split)));
    fitDevice();
    if (save) store.set('split', state.split.toFixed(1));
  }
  function validate() {
    const left = new Set((state.ids || []).map(String));
    const right = new Set(annotations.map((a) => String(a.id)));
    const issues = [];
    left.forEach((id) => { if (!right.has(id)) issues.push(fill(T.noCard, id)); });
    right.forEach((id) => { if (!left.has(id)) issues.push(fill(T.noBadge, id, id)); });
    $$('.card').forEach((c) => c.classList.toggle('is-orphan', !left.has(c.dataset.id)));
    const chip = $('#issues');
    chip.hidden = !issues.length;
    chip.lastElementChild.textContent = `${issues.length} ${T.issues}`;
    chip.title = issues.join('\n');
    console.info(`[vibe-prd] ${left.size} regions, ${right.size} annotations, ${issues.length} issues`);
    issues.forEach((i) => console.warn('[vibe-prd] ' + i));
  }

  /* ---------- lightbox ---------- */
  let lb = { svg: null, natural: 800, zoom: 1 };
  function zoomTo(z) {
    lb.zoom = Math.min(4, Math.max(0.25, z));
    if (lb.svg) lb.svg.style.width = Math.round(lb.natural * lb.zoom) + 'px';
    $('#lb-zoom').textContent = Math.round(lb.zoom * 100) + '%';
  }
  function openLightbox(i) {
    const host = $$('.dg-canvas')[i];
    const svg = host && (host.querySelector(`.svg-${root.dataset.theme === 'dark' ? 'dark' : 'light'} svg`) || host.querySelector('svg'));
    if (!svg) return;
    const body = $('#lb-body');
    body.innerHTML = '';
    const clone = svg.cloneNode(true);
    clone.removeAttribute('style'); clone.removeAttribute('width'); clone.removeAttribute('height');
    const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    lb = { svg: clone, natural: vb[2] || svg.getBoundingClientRect().width || 800, zoom: 1 };
    body.appendChild(clone);
    $('#lb-title').textContent = diagrams[i].title || '';
    lightbox.hidden = false;
    zoomTo(Math.min(2, (body.clientWidth - 56) / lb.natural));
    $('#lb-close').focus();
  }
  function closeLightbox() { lightbox.hidden = true; $('#lb-body').innerHTML = ''; }
  async function copyCode(i) {
    const text = String(diagrams[i].code || '').trim();
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (err) { /* give up quietly */ }
      ta.remove();
    }
    toast(T.copied);
  }

  /* ---------- events ---------- */
  let cardTimer = 0, cardHover = null;
  function bind() {
    $$('.tab').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    $('.tabs').addEventListener('keydown', (e) => {
      const order = ['notes', 'arch', 'edge'];
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      const next = order[(order.indexOf(state.tab) + d + order.length) % order.length];
      switchTab(next); $('#tab-' + next).focus();
    });
    $('#btn-badges').addEventListener('click', () => setBadges(!state.badges));
    $('#btn-theme').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
    $('#btn-print').addEventListener('click', () => window.print());
    $('#btn-reload').addEventListener('click', buildFrame);
    $('#btn-open').addEventListener('click', openPrototype);
    $$('#device-seg button').forEach((b) => b.addEventListener('click', () => setDevice(b.dataset.device)));
    $$('#view-seg button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

    docBody.addEventListener('click', (e) => {
      const t = e.target;
      const ref = t.closest('[data-ref]');
      if (ref) { locate(Number(ref.dataset.ref), { pin: true, explicit: true }); return; }
      const jump = t.closest('[data-jump]');
      if (jump) { const id = Number(jump.dataset.jump); revealCard(id, true); locate(id); return; }
      const act = t.closest('[data-act]');
      if (act) {
        const a = act.dataset.act, i = Number(act.dataset.i);
        if (a === 'locate') locate(Number(act.dataset.id), { pin: true, explicit: true });
        else if (a === 'zoom') openLightbox(i);
        else if (a === 'copy') copyCode(i);
        else if (a === 'code') { const box = act.closest('.dg').querySelector('.dg-code'); box.hidden = !box.hidden; act.setAttribute('aria-expanded', String(!box.hidden)); }
        return;
      }
      const head = t.closest('.card-head');
      if (head) togglePin(Number(head.closest('.card').dataset.id));
    });
    docBody.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('card')) locate(Number(e.target.dataset.id), { pin: true, explicit: true });
    });
    docBody.addEventListener('mouseover', (e) => {
      const card = e.target.closest('.card');
      const id = card ? Number(card.dataset.id) : null;
      if (id === cardHover) return;
      clearTimeout(cardTimer);
      if (cardHover != null) post({ type: 'hover', id: null });
      cardHover = id;
      if (id != null && !isNarrow()) cardTimer = setTimeout(() => locate(id), 260);
    });
    docBody.addEventListener('mouseleave', () => {
      clearTimeout(cardTimer);
      if (cardHover != null) { cardHover = null; post({ type: 'hover', id: null }); }
    });

    window.addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow) return;
      const m = e.data;
      if (!m || m.__vibePrd !== 1) return;
      if (m.type === 'ready') {
        state.ids = m.ids; validate();
        post({ type: 'badges', visible: state.badges });
        if (state.pinned != null) post({ type: 'pin', id: state.pinned });
      } else if (m.type === 'hover') revealCard(m.id, true);
      else if (m.type === 'click') { revealCard(m.id, true); state.pinned = state.pinned === m.id ? null : m.id; post({ type: 'pin', id: state.pinned }); if (isNarrow()) setView('doc'); }
      else if (m.type === 'hidden') toast(fill(T.hidden, m.id));
    });

    splitter.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const rect = split.getBoundingClientRect();
      app.classList.add('is-dragging');
      try { splitter.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
      const move = (ev) => setSplit(((ev.clientX - rect.left) / rect.width) * 100);
      const up = () => {
        app.classList.remove('is-dragging');
        splitter.removeEventListener('pointermove', move);
        splitter.removeEventListener('pointerup', up);
        splitter.removeEventListener('pointercancel', up);
        store.set('split', state.split.toFixed(1));
      };
      splitter.addEventListener('pointermove', move);
      splitter.addEventListener('pointerup', up);
      splitter.addEventListener('pointercancel', up);
    });
    splitter.addEventListener('dblclick', () => setSplit(58, true));
    splitter.addEventListener('keydown', (e) => {
      const d = { ArrowLeft: -2, ArrowRight: 2 }[e.key];
      if (d) { e.preventDefault(); setSplit(state.split + d, true); }
      else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); setSplit(e.key === 'Home' ? 30 : 75, true); }
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.closest('#lb-close')) closeLightbox();
      const z = e.target.closest('[data-zoom]');
      if (z) zoomTo(lb.zoom * (z.dataset.zoom === '1' ? 1.25 : 0.8));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!lightbox.hidden) closeLightbox();
        else if (state.pinned != null) { state.pinned = null; post({ type: 'pin', id: null }); }
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey || !lightbox.hidden) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
      const k = e.key.toLowerCase();
      if (k === 'b') setBadges(!state.badges);
      else if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
      else if (k === '1' || k === '2' || k === '3') switchTab(['notes', 'arch', 'edge'][Number(k) - 1]);
      else if (k === ']' || k === '[') {
        const ids = annotations.map((a) => Number(a.id));
        if (!ids.length) return;
        let i = ids.indexOf(state.current);
        i = i < 0 ? 0 : (i + (k === ']' ? 1 : -1) + ids.length) % ids.length;
        revealCard(ids[i], true); locate(ids[i]);
      }
    });
    if (window.ResizeObserver) new ResizeObserver(fitDevice).observe(canvas);
    else window.addEventListener('resize', fitDevice);
  }

  /* ---------- boot ---------- */
  chrome();
  renderNotes();
  renderArch();
  renderEdge();
  $('#btn-badges').setAttribute('aria-pressed', String(state.badges));
  setSplit(state.split);
  setDevice(state.device);
  setView('proto');
  bind();
  buildFrame();
  renderDiagrams();
  if (!D) console.error('[vibe-prd] window.VIBE_PRD is missing: check the DATA block.');
})();
</script>
</body>
</html>
